<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Nova Fleet — an original mobile-first 3D space combat and mining game built with Three.js."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <title>Nova Fleet // أسطول نوفا</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Nova Fleet game viewport"></canvas>
      <div id="pilot-name-bar" class="pilot-name-bar"></div>
      <div id="ui-root"></div>
      <div id="rotate-device" class="rotate-device" role="status" aria-live="polite">
        <div class="rotate-device__icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56" fill="none">
            <rect x="18" y="8" width="28" height="48" rx="5" stroke="currentColor" stroke-width="2.5" />
            <path d="M8 30c0-7 4-12 10-15M8 30l5-7M8 30l7 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </div>
        <strong data-rotate-title>Rotate to landscape</strong>
        <span data-rotate-body>Nova Fleet is designed for landscape flight.</span>
      </div>
      <noscript>Nova Fleet needs JavaScript enabled.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
